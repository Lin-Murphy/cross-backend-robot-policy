name: Core interfaces
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - name: Core and fake-device regression tests
        run: python -B scripts/test_core.py
      - name: Standalone adapter example
        run: python -B examples/adapter_template/run.py
